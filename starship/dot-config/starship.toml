format = "$sudo$directory$nix_shell$git_branch$rust$java$cmd_duration$character"

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[rust]
format = "via [$symbol$toolchain ]($style)"

[java]
style = "red"
symbol = "☕"

[sudo]
format = "[$symbol ]($style)"
symbol = "🔒"
disabled = true

[nix_shell]
symbol = " "
